name: 'Dependency Review (Org Required)'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
        with:
          config-file: ARKlab/public-required-workflows/.github/dependency-review-config.yml@main